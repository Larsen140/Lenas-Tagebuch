# Schickt Erinnerungen für Termine und To-Dos als Mitteilung. Läuft alle 5 Minuten.
name: Erinnerungen

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: erinnerungen
  cancel-in-progress: false

jobs:
  erinnern:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web-push installieren
        run: npm i --no-save web-push@3.6.7
      - name: Fällige Erinnerungen senden
        run: node .github/scripts/erinnerungen.mjs
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
