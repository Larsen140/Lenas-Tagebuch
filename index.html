<html lang="de">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagebuch">

<link rel="icon" type="image/png" href="icons/icon-192.png">

<title>Lenas Tagebuch</title>
<script>
// Hell/Dunkel sofort setzen, damit beim Start nichts schwarz aufblitzt
(function(){try{var st=JSON.parse(localStorage.getItem('lt.settings.v1')||'{}'),t=st.theme||'system';
var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
:root{
  --a1:#39a0ff; --a2:#7fd4ff; --a3:#c9f3ff; --a4:#1e4fff;
  --glass-alpha:.42; --fs:16px; --radius:22px;
  --b1:var(--a1); --b2:var(--a2); --b3:var(--a3); --b4:var(--a4);
}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--b4) 22%,#020611); --bg2:color-mix(in srgb,var(--b1) 42%,#061030); --bg3:color-mix(in srgb,var(--b4) 38%,#050b22); --text:#eaf4ff; --muted:rgba(214,232,255,.62);
  --glass:color-mix(in srgb,var(--b4) 22%,rgba(12,22,52,var(--glass-alpha))); --glass-strong:color-mix(in srgb,var(--b4) 16%,rgba(10,18,44,.84));
  --glass-border:rgba(160,210,255,.20); --glass-hi:rgba(255,255,255,.12);
  --input:rgba(255,255,255,.07); --shadow:0 12px 40px rgba(0,8,35,.55);
  --title-grad:linear-gradient(90deg,#ffffff 0%,var(--a3) 40%,var(--a2) 70%,#ffffff 100%);
  --blob-op:.5; --base:color-mix(in srgb,var(--b4) 28%,#030818);
}
:root[data-theme="light"]{
  --bg:color-mix(in srgb,var(--b3) 45%,#f4f8ff); --bg2:color-mix(in srgb,var(--b2) 40%,#eef4ff); --bg3:color-mix(in srgb,var(--b3) 70%,#ffffff); --text:#0b1733; --muted:rgba(20,40,80,.58);
  --glass:rgba(255,255,255,calc(var(--glass-alpha) + .12)); --glass-strong:rgba(250,252,255,.86);
  --glass-border:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.7);
  --input:rgba(255,255,255,.6); --shadow:0 10px 30px rgba(40,90,170,.16);
  --title-grad:linear-gradient(90deg,var(--a4) 0%,var(--a1) 50%,var(--a4) 100%);
  --blob-op:.35; --base:color-mix(in srgb,var(--b3) 55%,#ffffff);
}
*{box-sizing:border-box}
html{min-height:calc(100% + env(safe-area-inset-top) + env(safe-area-inset-bottom))}
html,body{margin:0;min-height:100%;background:var(--base);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:var(--fs);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;transition:background .4s}
body.sheet-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hidden{display:none!important}

/* ---------- Hintergrund: leuchtendes blaues Auge ---------- */
.bg{position:fixed;top:-160px;left:0;right:0;bottom:-240px;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(165deg,var(--bg2) 0%,var(--bg3) 50%,var(--bg) 100%)}
.blob{position:absolute;border-radius:50%;opacity:var(--blob-op);will-change:transform;transform:translateZ(0);
  background:radial-gradient(circle at 50% 50%,var(--c) 0%,color-mix(in srgb,var(--c) 45%,transparent) 35%,transparent 68%)}
.b1{--c:var(--b1);width:95vmax;height:95vmax;top:-40vmax;left:-38vmax;animation:float1 24s ease-in-out infinite alternate}
.b2{--c:var(--b4);width:95vmax;height:95vmax;bottom:-40vmax;right:-38vmax;animation:float2 28s ease-in-out infinite alternate}
.b3{--c:var(--b2);width:65vmax;height:65vmax;top:22%;right:-28vmax;opacity:calc(var(--blob-op)*.65);animation:float3 21s ease-in-out infinite alternate}
.b4{--c:var(--b1);width:70vmax;height:70vmax;bottom:-18vmax;left:-30vmax;opacity:calc(var(--blob-op)*.8);animation:float4 26s ease-in-out infinite alternate}
.sparkles{position:absolute;inset:0;
  background-image:radial-gradient(1.6px 1.6px at 12% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 14%,var(--a3),transparent),
  radial-gradient(1.8px 1.8px at 64% 62%,#fff,transparent),radial-gradient(1.2px 1.2px at 28% 74%,var(--a3),transparent),
  radial-gradient(1.4px 1.4px at 88% 82%,#fff,transparent),radial-gradient(1.2px 1.2px at 42% 38%,var(--a2),transparent),
  radial-gradient(1.6px 1.6px at 8% 92%,#fff,transparent),radial-gradient(1.2px 1.2px at 94% 44%,var(--a3),transparent);
  animation:twinkle 5s ease-in-out infinite alternate;opacity:.8}
:root[data-theme="light"] .sparkles{opacity:.25}
@keyframes float1{to{transform:translate3d(18vw,14vh,0) scale(1.12)}}
@keyframes float2{to{transform:translate3d(-16vw,-12vh,0) scale(1.08)}}
@keyframes float3{to{transform:translate3d(-14vw,10vh,0) scale(1.15)}}
@keyframes float4{to{transform:translate3d(12vw,-10vh,0) scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.88);opacity:.75}50%{transform:scale(1.08);opacity:1}}
@keyframes twinkle{0%{opacity:.25}100%{opacity:.85}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pat{position:absolute;inset:-180px;display:none;opacity:var(--pat-op,.18);background:var(--pc);will-change:transform;
  -webkit-mask-repeat:repeat;mask-repeat:repeat;animation:patDrift 50s linear infinite}

/* Vorschau-Kacheln in den Einstellungen */
.pat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pat-tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78em;color:var(--muted);font-weight:600}
.pt-bg{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;
  background:radial-gradient(70% 60% at 25% 20%,color-mix(in srgb,var(--b1) 70%,transparent),transparent 70%),linear-gradient(165deg,var(--bg2),var(--bg3) 55%,var(--bg));
  box-shadow:inset 0 0 0 1px var(--glass-border);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.pt-bg .pat{inset:-50%;transform:scale(.5);animation:none;opacity:max(var(--pat-op,.18),.32)}
.pat-tile.on{color:var(--text)}
.pat-tile.on .pt-bg{box-shadow:0 0 0 2.5px var(--text),0 4px 14px color-mix(in srgb,var(--b1) 45%,transparent);transform:scale(1.04)}
.swatch.auto{background:conic-gradient(#39a0ff,#8b6cff,#ff7eb6,#ffaa33,#22c79b,#39a0ff)!important;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
body.no-anim .bg *,body.no-anim h1{animation:none!important}
@media (prefers-reduced-motion:reduce){.bg *,h1{animation:none!important}}

/* ---------- Liquid Glass ---------- */
.glass,.card{position:relative;
  background:linear-gradient(140deg,var(--glass-hi) 0%,transparent 45%),var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04)}

/* ---------- Layout ---------- */
.app{transition:transform .45s cubic-bezier(.2,.9,.2,1),filter .45s,opacity .45s;transform-origin:50% 0;position:relative;z-index:1;max-width:1100px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 130px) calc(env(safe-area-inset-left) + 16px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px}
h1{margin:0;font-size:1.75em;font-weight:800;letter-spacing:-.02em;line-height:1.1;
  background:var(--title-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s linear infinite}
.subtitle{color:var(--muted);font-size:.88em;margin-top:4px}
.top-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:active{transform:scale(.86);transition-duration:.08s}
button,a,input,label{touch-action:manipulation}
.icon-btn svg{width:21px;height:21px}
.icon-btn.glass{border-radius:50%}
#syncBtn.busy svg{animation:spin 1s linear infinite}
#syncBtn .badge{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#ff5c7a;box-shadow:0 0 0 2px var(--bg);display:none}
#syncBtn.error .badge{display:block}
#syncBtn.off{opacity:.55}

.today{padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;cursor:pointer;animation:fadeUp .4s}
.today .orb{width:38px;height:38px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#fff 0%,var(--a3) 18%,var(--a2) 38%,var(--a1) 60%,var(--a4) 100%);
  box-shadow:0 0 18px var(--a2)}
.today b{display:block;font-size:.98em}
.today span{color:var(--muted);font-size:.86em}

.tab{display:none}
.tab.active{display:block;animation:tabIn .42s cubic-bezier(.2,.9,.2,1) both}
.tab.active.from-left{animation-name:tabInLeft}
.section-title{font-size:1.05em;margin:18px 4px 10px;font-weight:700}
.card{padding:14px 16px;margin-bottom:12px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);-webkit-backdrop-filter:none;backdrop-filter:none;contain:layout paint}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.97);transition-duration:.1s}

/* Suche / Quick-Add */
.search{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 14px;margin-bottom:14px;border-radius:16px}
.search svg{width:18px;height:18px;opacity:.6;flex:none}
.search input{border:0;background:transparent;padding:11px 4px;box-shadow:none!important}
.mini-add{width:38px;height:38px;border-radius:12px;flex:none;font-size:22px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--a2),var(--a1) 55%,var(--a4))}

/* Notizen */
.notes-grid{display:grid;gap:12px}
@media (min-width:640px){.notes-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.notes-grid{grid-template-columns:1fr 1fr 1fr}}
.notes-grid .card{margin:0}
.note-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8em}
.note h3{margin:6px 0 6px;font-size:1.05em;line-height:1.3;word-break:break-word}
.note p{margin:0;color:var(--muted);font-size:.93em;line-height:1.45;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* Kalender */
.cal-layout{display:block}
@media (min-width:820px){.cal-layout{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}.cal-layout .section-title{margin-top:4px}}
.cal{padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-title{font-weight:700;font-size:1.1em;padding:8px 12px;border-radius:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cal-dow{text-align:center;font-size:.72em;font-weight:600;color:var(--muted);padding:4px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.cal-day{width:100%;min-width:0;height:auto;aspect-ratio:1/1;max-height:62px;margin:0;line-height:1;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:500;font-size:.95em;transition:background .2s}
.cal-day.other{opacity:.3}
.cal-day.past:not(.other):not(.sel){opacity:.55}
.cal-day.today{color:var(--a1);font-weight:800;box-shadow:inset 0 0 0 1.5px var(--a1)}
:root[data-theme="dark"] .cal-day.today{color:var(--a2);box-shadow:inset 0 0 0 1.5px var(--a2)}
.cal-day.sel{background:linear-gradient(135deg,var(--a2),var(--a1) 55%,var(--a4));color:#fff!important;font-weight:700;box-shadow:0 4px 16px color-mix(in srgb,var(--a1) 55%,transparent)}
.dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.dot{width:5px;height:5px;border-radius:50%}
.cal-day.sel .dot{background:#fff!important}

.ev{display:flex;gap:12px;align-items:stretch}
.ev .bar{width:4px;border-radius:4px;flex:none}
.ev .time{width:54px;flex:none;font-size:.85em;color:var(--muted);line-height:1.35;padding-top:1px}
.ev .time b{color:var(--text);font-weight:600;display:block}
.ev .info{flex:1;min-width:0}
.ev .info b{display:block;word-break:break-word}
.ev .info span{color:var(--muted);font-size:.86em;display:block;margin-top:2px;word-break:break-word}

/* To-Dos */
.todo{display:flex;gap:12px;align-items:center}
.check{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2px solid color-mix(in srgb,var(--a1) 70%,transparent);transition:.2s}
.check svg{width:15px;height:15px;opacity:0;transition:.2s;color:#fff}
.todo.done .check{background:linear-gradient(135deg,var(--a2),var(--a1));border-color:transparent}
.todo.done .check svg{opacity:1}
.todo-main{flex:1;min-width:0;cursor:pointer}
.todo-text{word-break:break-word;line-height:1.35}
.todo.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-due{font-size:.8em;color:var(--muted);margin-top:3px}
.todo-due.late{color:#ff6b8a;font-weight:600}
.todo-due.soon{color:var(--a1);font-weight:600}
:root[data-theme="dark"] .todo-due.soon{color:var(--a2)}
.section-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 6px 10px;color:var(--muted);font-weight:600;font-size:.92em}
.text-btn{color:var(--a1);font-weight:600;font-size:.9em;padding:8px 6px}
:root[data-theme="dark"] .text-btn{color:var(--a2)}

/* Leerer Zustand */
.empty{text-align:center;padding:48px 20px 20px;color:var(--muted);grid-column:1/-1}
.empty .orb{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--a3) 20%,var(--a2) 42%,var(--a1) 64%,transparent 72%);filter:drop-shadow(0 0 18px var(--a2));opacity:.8}
.empty h3{color:var(--text);margin:0 0 6px;font-size:1.05em}
.empty p{margin:0;font-size:.92em}

/* Tab-Leiste, FAB, Wasserzeichen */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 30px);
  display:flex;gap:2px;padding:6px;border-radius:999px;width:min(calc(100% - 24px),520px)}
.tabbar button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;white-space:nowrap;border-radius:999px;
  font-size:10.5px;font-weight:600;color:var(--muted);transition:.25s}
.tabbar svg{width:23px;height:23px}
.tabbar button.active{color:var(--text);background:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
:root[data-theme="dark"] .tabbar button.active{color:#fff}
.fab{transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .25s;position:fixed;z-index:31;right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 106px);
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 30%,var(--a3) 0%,var(--a2) 22%,var(--a1) 55%,var(--a4) 100%);
  box-shadow:0 8px 28px color-mix(in srgb,var(--a1) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .2s}
.fab:active{transform:scale(.88);transition-duration:.08s}
.fab svg{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.fab.turn svg{transform:rotate(90deg)}
.fab.hidden{display:grid!important;transform:scale(0) rotate(-90deg);opacity:0;pointer-events:none}
.fab svg{width:26px;height:26px}
@media (min-width:1100px){.fab{right:calc(50% - 530px)}}
.watermark{position:fixed;z-index:29;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 2px);text-align:center;line-height:1.35;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7;pointer-events:none}

/* Sheets */
.sheet-layer{position:fixed;inset:0;z-index:50;background:rgba(0,6,24,.38);opacity:0;pointer-events:none;transition:opacity .25s;
  display:flex;align-items:flex-end;justify-content:center}
.sheet-layer.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border-radius:28px 28px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 24px);
  background:linear-gradient(160deg,var(--glass-hi) 0%,transparent 40%),var(--glass-strong);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-border);box-shadow:0 -10px 40px rgba(0,0,0,.3);
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.2,1)}
.sheet-layer.open .sheet{transform:none}
@media (min-width:700px){.sheet-layer{align-items:center}.sheet{border-radius:28px;margin:24px;padding-bottom:24px}}
.grabber{width:38px;height:5px;border-radius:5px;background:var(--muted);opacity:.5;margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-8px;z-index:2;padding:6px 0 10px;margin:0 -4px}
.sheet-head h2{font-size:1.05em;margin:0;text-align:center;flex:1}
.link{color:var(--a1);font-size:1em;padding:8px 6px;min-width:80px;text-align:left}
.link.strong{font-weight:700;text-align:right}
:root[data-theme="dark"] .link{color:var(--a2)}

/* Formulare */
.field{display:block;margin:14px 0}
.field>span{display:block;font-size:.8em;font-weight:600;color:var(--muted);margin:0 4px 7px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{font:inherit;font-size:max(16px,1em);color:var(--text);background:var(--input);
  border:1px solid var(--glass-border);border-radius:14px;padding:12px 14px;width:100%;outline:none;display:block;
  -webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
input[type=date],input[type=time]{min-height:48px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 25%,transparent)}
textarea{resize:none;line-height:1.5;min-height:110px}
textarea.big{min-height:240px}
input.title-in{font-size:1.2em;font-weight:700}
input[type=range]{padding:0;height:30px;background:transparent;border:0;box-shadow:none!important}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--a3),var(--a1))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px}
.row .lbl b{display:block;font-weight:600}
.row .lbl small{color:var(--muted);font-size:.82em}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;z-index:1;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(130,145,175,.4);transition:.25s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s}
.switch input:checked+span{background:var(--a1)}
.switch input:checked+span::after{transform:translateX(20px)}
.seg{display:flex;background:var(--input);border:1px solid var(--glass-border);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:.92em;font-weight:600;color:var(--muted);transition:.2s}
.seg button.on{color:#fff;background:linear-gradient(135deg,var(--a2),var(--a1) 60%,var(--a4));box-shadow:0 2px 10px color-mix(in srgb,var(--a1) 40%,transparent)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:5px}
.swatch{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 8px rgba(0,0,0,.2);transition:transform .2s}
.swatch.on{outline:3px solid var(--text);outline-offset:3px;transform:scale(1.05)}
.swatch.sm{width:32px;height:32px}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.moods button{width:44px;height:44px;border-radius:14px;font-size:22px;background:var(--input);border:1px solid var(--glass-border);transition:.2s}
.moods button.on{background:color-mix(in srgb,var(--a1) 30%,transparent);border-color:var(--a1);transform:scale(1.08)}
.btn:active{transform:scale(.96)}
.btn{transition:transform .25s cubic-bezier(.34,1.56,.64,1);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--a2),var(--a1) 55%,var(--a4));box-shadow:0 6px 20px color-mix(in srgb,var(--a1) 40%,transparent)}
.btn.ghost{background:var(--input);color:var(--text);box-shadow:none;border:1px solid var(--glass-border)}
.btn.danger{background:rgba(255,80,110,.14);color:#ff5c7a;box-shadow:none;border:1px solid rgba(255,92,122,.3)}
.btn.full{width:100%;margin-top:10px}
.group{margin:8px 0 22px}
.group h3{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 4px}
.group .box{padding:4px 16px;border-radius:18px;background:var(--input);border:1px solid var(--glass-border)}
.group .box .row+.row{border-top:1px solid var(--glass-border)}
.hint{color:var(--muted);font-size:.85em;line-height:1.45;margin:6px 4px}
.sync-status{font-size:.88em;margin:10px 4px;line-height:1.4}
.sync-status.ok{color:#2fcf8f}.sync-status.err{color:#ff5c7a}
.about{text-align:center;color:var(--muted);font-size:.85em;line-height:1.7;margin:26px 0 6px}
.about b{background:var(--title-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.05em}

/* Toast & Install-Hinweis */
#toast{position:fixed;z-index:80;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);
  padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92em;transition:transform .35s cubic-bezier(.2,.9,.2,1),opacity .3s;max-width:90vw;text-align:center;opacity:0}
#toast.show{transform:translate(-50%,0);opacity:1}
/* Installations-Sperre */
.gate-card .btn{margin-top:14px}
#pushGate{z-index:210;top:-200px;bottom:-200px;padding-top:calc(200px + env(safe-area-inset-top) + 24px);padding-bottom:calc(200px + env(safe-area-inset-bottom) + 24px);
  background:radial-gradient(60% 35% at 50% 50%,color-mix(in srgb,var(--b1) 40%,transparent),transparent 72%),var(--base)}
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);overflow-y:auto}
.gate-card{width:100%;max-width:420px;padding:28px 22px 24px;text-align:center;animation:fadeUp .5s ease}
.gate-card img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px color-mix(in srgb,var(--a1) 50%,transparent)}
.gate-card h2{margin:16px 0 6px;font-size:1.4em;background:var(--title-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-card>p{color:var(--muted);margin:0 0 20px;line-height:1.45}
.steps{text-align:left;display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--input);border:1px solid var(--glass-border);line-height:1.35}
.step .n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--a2),var(--a1) 55%,var(--a4))}
.step svg{width:20px;height:20px;vertical-align:-4px;color:var(--a2)}
.gate-foot{margin-top:18px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.watermark .ver,.gate-foot .ver{letter-spacing:.08em;opacity:.8}
/* Updates */
.tabbar button{position:relative}
.tab-dot{display:none;position:absolute;top:6px;right:16px;width:9px;height:9px;border-radius:50%;background:#ff5c7a;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.tabbar.has-new .tab-dot{display:block}
.rel{padding:16px 16px 10px}
.rel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.rel-head b{font-size:1.1em}
.rel-head span{color:var(--muted);font-size:.82em}
.rel-new{font-size:.7em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:99px;margin-left:8px;vertical-align:2px;
  background:linear-gradient(135deg,var(--a1),var(--a4));text-shadow:0 1px 2px rgba(0,0,0,.25)}
.chg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--glass-border);line-height:1.4;font-size:.94em}
.tag{flex:none;font-size:.7em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:8px;margin-top:1px;min-width:96px;text-align:center}
.tag.neu{background:rgba(34,199,155,.18);color:#13a37c}
:root[data-theme="dark"] .tag.neu{color:#4be3b6}
:root[data-theme="dark"] .tag.fix{color:#ffb15e}
.tag.besser{background:color-mix(in srgb,var(--a1) 20%,transparent);color:var(--a1)}
:root[data-theme="dark"] .tag.besser{color:var(--a2)}
.tag.fix{background:rgba(255,159,67,.18);color:#f08a24}
.upd-intro{color:var(--muted);font-size:.9em;margin:0 6px 14px;line-height:1.45}
/* ---------- Animationen ---------- */
@keyframes tabIn{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
@keyframes tabInLeft{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes selPop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes orbPulse{0%,100%{transform:scale(1);box-shadow:0 0 14px var(--a2)}50%{transform:scale(1.08);box-shadow:0 0 26px var(--a2)}}
.tab.enter .card,.tab.enter .empty{animation:cardIn .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
.tab.enter :is(.card,.empty):nth-child(2){--i:1}.tab.enter :is(.card,.empty):nth-child(3){--i:2}.tab.enter :is(.card,.empty):nth-child(4){--i:3}.tab.enter :is(.card,.empty):nth-child(5){--i:4}.tab.enter :is(.card,.empty):nth-child(6){--i:5}.tab.enter :is(.card,.empty):nth-child(7){--i:6}.tab.enter :is(.card,.empty):nth-child(8){--i:7}.tab.enter :is(.card,.empty):nth-child(9){--i:8}.tab.enter :is(.card,.empty):nth-child(10){--i:9}.tab.enter :is(.card,.empty):nth-child(11){--i:10}.tab.enter :is(.card,.empty):nth-child(12){--i:11}
.tab.enter :is(.card,.empty):nth-child(n+13){--i:12}
.check.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.cal-day.sel{animation:selPop .35s cubic-bezier(.34,1.56,.64,1)}
.today .orb{animation:orbPulse 4s ease-in-out infinite}
body.sheet-open .app{transform:scale(.955);filter:brightness(.8);opacity:.9}
.sheet{transition:transform .5s cubic-bezier(.22,1.2,.36,1)}
/* Flüssigglas-Blase in der Tab-Leiste */
.tab-pill{position:absolute;top:6px;left:0;height:calc(100% - 12px);border-radius:999px;pointer-events:none;z-index:0;
  background:linear-gradient(140deg,rgba(255,255,255,.35),transparent 55%),color-mix(in srgb,var(--a1) 30%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px color-mix(in srgb,var(--a1) 35%,transparent);
  transform:translateX(var(--x,0));transition:transform .55s cubic-bezier(.34,1.45,.5,1),width .45s cubic-bezier(.34,1.45,.5,1)}
.tabbar button{z-index:1}
@media (prefers-reduced-motion:reduce){.tab.active,.tab.enter .card,.tab-pill,.sheet,.app{animation:none!important;transition:none!important}}
::placeholder{color:var(--muted);opacity:.85}
/* Ladebildschirm */
#splash{position:fixed;top:-200px;bottom:-200px;left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(55% 32% at 50% 50%,color-mix(in srgb,var(--b1) 50%,transparent),transparent 72%),var(--base);
  transition:opacity .4s ease,visibility .4s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash.instant{transition:none}
.sp-icon{width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font:800 54px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:#fff;
  background:radial-gradient(circle at 30% 25%,var(--a3) 0%,var(--a2) 25%,var(--a1) 60%,var(--a4) 100%);
  box-shadow:0 12px 40px color-mix(in srgb,var(--a1) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.6);
  text-shadow:0 0 18px rgba(255,255,255,.7);animation:spPulse 1.6s ease-in-out infinite}
.sp-title{font-weight:800;font-size:22px;letter-spacing:-.01em;background:var(--title-grad);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.5s linear infinite}
.sp-bar{width:120px;height:4px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--text) 15%,transparent)}
.sp-bar i{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a2),var(--a1));animation:spLoad 1s ease-in-out infinite}
@keyframes spPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
</style>
</head>

<div class="app">
  <header class="top">
    <div>
      <h1>Lenas Tagebuch</h1>

    </div>
    <div class="top-actions">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

</div>

  <div class="gate-card glass">
    <img src="icons/apple-touch-icon.png" alt="">

</div>

<script>
(() => {
'use strict';

/* ================= Helfer ================= */
const APP_VERSION = '1.29';
// Wurde die App über eine Benachrichtigung geöffnet? (vor dem Aufräumen der Adresse merken)
const OPEN_TAB = new URLSearchParams(location.search).get('open') || (location.hash === '#updates' ? 'updates' : null); // interne Nummer nur zum Erkennen von Updates – bei JEDEM Upload erhöhen
// Bei jedem Update oben einen Eintrag ergänzen. Typ: 'neu' | 'besser' | 'fix'
const CHANGELOG = [
  { v: '1.11', date: '2026-11-11', items: [
    ['neu', 'Hintergrund-Muster: Sterne, Herzen, Blüten, Punkte, Wellen, Blasen, Raster und Streifen.'],
    ['neu', 'Eigene Hintergrundfarbe – unabhängig von der App-Farbe.'],
    ['neu', 'Benachrichtigungen bei neuen Updates (unter Optionen einschalten).'] ] },
  { v: '1.10', date: '2026-11-10', items: [
    ['neu', 'An vergangenen Tagen im Kalender kann nichts Neues mehr eingetragen werden. Alte Termine bleiben, bis du sie selbst löschst.'] ] },
  { v: '1.9', date: '2026-11-10', items: [
    ['besser', 'Die Einstellungen sind jetzt ein eigener Tab „Optionen" unten neben Updates.'] ] },
  { v: '1.8', date: '2026-11-10', items: [
    ['neu', 'Ladebildschirm beim Öffnen der App.'] ] },
  { v: '1.7', date: '2026-11-10', items: [
    ['fix', 'Der dunkle Balken unten beim Öffnen der App ist weg.'] ] },
  { v: '1.6', date: '2026-11-10', items: [
    ['fix', 'Updates kommen jetzt automatisch an – die App muss dafür nicht mehr geschlossen werden.'] ] },
  { v: '1.5', date: '2026-11-10', items: [
    ['besser', 'Die App läuft flüssiger – vor allem beim Scrollen.'],
    ['besser', 'Einträge werden schneller zwischen iPhone und iPad synchronisiert.'],
    ['neu', 'Neue Animationen: gleitende Glas-Blase in der Tab-Leiste, Karten erscheinen sanft, Häkchen ploppen.'],
    ['neu', '7 neue Farben: Türkis, Lavendel, Kirschblüte, Koralle, Beere, Wald und Graphit.'],
    ['besser', 'Der Hintergrund passt sich jetzt der gewählten Farbe an.'] ] },
  { v: '1.4', date: '2026-11-10', items: [
    ['neu', 'Neuer Tab „Updates": Hier siehst du, was sich in der App geändert hat.'] ] },
  { v: '1.3', date: '2026-11-10', items: [
    ['besser', 'Die Versionsnummer steht jetzt immer unten unter „Made by Larsen".'] ] },
  { v: '1.2', date: '2026-11-10', items: [
    ['fix', 'Updates kommen jetzt sofort beim nächsten Öffnen an, statt erst nach ein paar Minuten.'] ] },
  { v: '1.1', date: '2026-11-09', items: [
    ['neu', 'Neue Farbe Rot in den Einstellungen.'],
    ['besser', 'Für die Synchronisation muss nur noch der Token eingetragen werden.'] ] },
  { v: '1.0', date: '2026-11-09', items: [
    ['neu', 'Lenas Tagebuch ist da: Notizen, Kalender, To-Dos, Einstellungen und Sync zwischen iPhone und iPad.'] ] }
];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const p = String(s || '').split('-').map(Number); return (p.length === 3 && p.every(n => !isNaN(n))) ? new Date(p[0], p[1] - 1, p[2]) : new Date(); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DOW_BASE = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtLong = s => parseYmd(s).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parseYmd(s).toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: parseYmd(s).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
const groupBy = (arr, key) => arr.reduce((m, x) => { (m[x[key]] = m[x[key]] || []).push(x); return m; }, {});

/* ================= Speicher ================= */
const DATA_KEY = 'lt.data.v1', SET_KEY = 'lt.settings.v1', FILE = 'lenas-tagebuch.json';
const DEFAULTS = { pushOn: false, pushEndpoint: '', deviceId: '', theme: 'system', accent: 'unendlich', pattern: 'fliessend', bgColor: 'auto', patOp: 0.2, anim: true, glass: 0.42, font: 'normal', weekStart: 1,
  todayHint: true, owner: '', repo: '', token: '', lastSync: 0, tab: 'notes' };

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('Speichern auf dem Gerät fehlgeschlagen'); } }
function normalize(d) {
  d = (d && typeof d === 'object') ? d : {};
  const arr = a => Array.isArray(a) ? a.filter(x => x && typeof x === 'object' && x.id) : [];
  return { notes: arr(d.notes), events: arr(d.events), todos: arr(d.todos) };
}

const GH_OWNER = 'Larsen140', GH_REPO = 'lenas-tagebuch-daten'; // fest eingestellt
let S = Object.assign({}, DEFAULTS, load(SET_KEY) || {});
S.owner = GH_OWNER; S.repo = GH_REPO;
let D = normalize(load(DATA_KEY));
const live = list => list.filter(x => !x.deleted);

function saveSettings() { store(SET_KEY, S); }
function saveData() { store(DATA_KEY, D); scheduleSync(); }
function upsert(list, item) {
  item.updatedAt = now();
  const i = D[list].findIndex(x => x.id === item.id);
  if (i >= 0) D[list][i] = item; else { item.createdAt = item.createdAt || now(); D[list].push(item); }
  saveData(); render();
}
function removeItem(list, id) {
  D[list] = D[list].map(x => x.id === id ? { id, deleted: true, updatedAt: now() } : x);
  saveData(); render();
}

/* ================= Farben & Darstellung ================= */
const ACCENTS = {
  unendlich: { name: 'Unendlich Blau', a1: '#39a0ff', a2: '#7fd4ff', a3: '#c9f3ff', a4: '#1e4fff' },
  eis:       { name: 'Eiskristall',    a1: '#4cc9f0', a2: '#a0eaff', a3: '#e6fbff', a4: '#2678c9' },
  tiefsee:   { name: 'Tiefsee',        a1: '#2f6bff', a2: '#5fa8ff', a3: '#b5d8ff', a4: '#1a2fbf' },
  violett:   { name: 'Violett',        a1: '#8b6cff', a2: '#b8a4ff', a3: '#ece6ff', a4: '#4d2fd6' },
  rose:      { name: 'Rosé',           a1: '#ff7eb6', a2: '#ffb3d1', a3: '#ffe6f1', a4: '#d6457f' },
  mint:      { name: 'Mint',           a1: '#22c79b', a2: '#7eedcc', a3: '#dafff3', a4: '#0f8f6f' },
  gold:      { name: 'Sonnengold',     a1: '#ffaa33', a2: '#ffd27f', a3: '#fff1d6', a4: '#e0700a' },
  rot:       { name: 'Rot',            a1: '#ff3b4e', a2: '#ff8591', a3: '#ffe0e4', a4: '#c4102b' },
  tuerkis:   { name: 'Türkis',         a1: '#14c3c8', a2: '#6fe3e2', a3: '#d8fbf9', a4: '#08808e' },
  lavendel:  { name: 'Lavendel',       a1: '#a68bff', a2: '#cbb9ff', a3: '#f2edff', a4: '#7356e0' },
  kirsch:    { name: 'Kirschblüte',    a1: '#f06ad0', a2: '#f7a8e6', a3: '#fde6f7', a4: '#b3349a' },
  koralle:   { name: 'Koralle',        a1: '#ff7a59', a2: '#ffae96', a3: '#ffe7df', a4: '#d9472a' },
  beere:     { name: 'Beere',          a1: '#d63a6b', a2: '#ee7d9f', a3: '#fbe1ea', a4: '#8f1640' },
  wald:      { name: 'Wald',           a1: '#46a35a', a2: '#8fd39b', a3: '#e2f6e5', a4: '#256b34' },
  graphit:   { name: 'Graphit',        a1: '#7c8aa3', a2: '#b6c0d2', a3: '#eef1f6', a4: '#3f4a5e' }
};
const EV_COLORS = { accent: null, rosa: '#ff6fae', mint: '#22c79b', orange: '#ff9f43', lila: '#8b6cff', rot: '#ff5c6c' };
const evColor = c => EV_COLORS[c] || (ACCENTS[S.accent] || ACCENTS.unendlich).a1;
const PATTERNS = { fliessend: 'Fließend', sterne: 'Sterne', herzen: 'Herzen', blueten: 'Blüten', punkte: 'Punkte', wellen: 'Wellen', blasen: 'Blasen', raster: 'Raster', streifen: 'Streifen' };
const mq = window.matchMedia('(prefers-color-scheme: dark)');

function applySettings() {
  const r = document.documentElement;
  const a = ACCENTS[S.accent] || ACCENTS.unendlich;
  ['a1','a2','a3','a4'].forEach(k => r.style.setProperty('--' + k, a[k]));
  const bgc = S.bgColor !== 'auto' && ACCENTS[S.bgColor] ? ACCENTS[S.bgColor] : a;
  ['1','2','3','4'].forEach(k => r.style.setProperty('--b' + k, bgc['a' + k]));
  $('.bg').dataset.pat = PATTERNS[S.pattern] ? S.pattern : 'fliessend';
  r.style.setProperty('--pat-op', S.patOp);
  const dark = S.theme === 'dark' || (S.theme === 'system' && mq.matches);
  r.dataset.theme = dark ? 'dark' : 'light';
  // Grundfarbe auch als Statusleisten-/Systemfarbe setzen (iOS malt den Startbalken in dieser Farbe)
  requestAnimationFrame(() => { try { const c = document.createElement('canvas').getContext('2d'); c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--base').trim() || '#030818'; c.fillRect(0, 0, 1, 1);
    const d = c.getImageData(0, 0, 1, 1).data; const hex = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    $('meta[name="theme-color"]').setAttribute('content', hex); document.documentElement.style.backgroundColor = hex; } catch {} });
  r.style.setProperty('--glass-alpha', S.glass);

mq.addEventListener ? mq.addEventListener('change', applySettings) : mq.addListener(applySettings);

/* ================= Toast ================= */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ================= Sheet (Popup) ================= */
function openSheet(title, html, { onSave, onDelete, saveLabel = 'Sichern', deleteLabel = 'Löschen' } = {}) {
  const old = $('#sheet'), sh = old.cloneNode(false); // frisches Element = keine alten Event-Listener
  old.replaceWith(sh);
  sh.innerHTML = `<div class="grabber"></div>
    <div class="sheet-head">
      <button class="link" data-act="cancel">${onSave ? 'Abbrechen' : ''}</button>
      <h2>${esc(title)}</h2>
      <button class="link strong" data-act="${onSave ? 'save' : 'cancel'}">${onSave ? esc(saveLabel) : 'Fertig'}</button>
    </div>
    <div class="sheet-body">${html}</div>
    ${onDelete ? `<button class="btn danger full" data-act="delete">${esc(deleteLabel)}</button>` : ''}`;
  sh.onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'cancel') closeSheet();
    else if (act === 'save') { if (onSave() !== false) closeSheet(); }
    else if (act === 'delete') { if (confirm('Wirklich löschen?')) { onDelete(); closeSheet(); } }
  };
  $('#sheetLayer').classList.add('open');
  document.body.classList.add('sheet-open');
  sh.scrollTop = 0;
  return sh;
}
function closeSheet() {
  $('#sheetLayer').classList.remove('open');
  document.body.classList.remove('sheet-open');
  if (document.activeElement) document.activeElement.blur();
  if (pendingUpdate) setTimeout(applyUpdate, 500);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

const toggleRow = (id, label, small, checked) => `
  <div class="row"><div class="lbl"><b>${label}</b>${small ? `<small>${small}</small>` : ''}</div>
  <label class="switch"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''}><span></span></label></div>`;
const seg = (key, opts) => `<div class="seg" data-seg="${key}">${opts.map(([v, l]) =>
  `<button type="button" data-val="${v}" class="${String(S[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
function autogrow(ta) { const f = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }; ta.addEventListener('input', f); setTimeout(f, 30); }

/* ================= Tabs ================= */
const TAB_ORDER = ['notes', 'cal', 'todo', 'updates', 'settings'];
let curTab = null;
function movePill(animate) {
  const btn = $(`.tabbar button[data-tab="${S.tab}"]`), pill = $('.tab-pill');
  if (!btn || !pill) return;
  if (!animate) pill.style.transition = 'none';
  pill.style.width = btn.offsetWidth + 'px';
  pill.style.setProperty('--x', btn.offsetLeft + 'px');
  if (!animate) requestAnimationFrame(() => { pill.style.transition = ''; });
}
window.addEventListener('resize', () => movePill(false));
function stagger(sec) {
  sec.classList.add('enter');
  clearTimeout(sec._st); sec._st = setTimeout(() => sec.classList.remove('enter'), 1100);
}
function setTab(t) {
  const back = curTab && TAB_ORDER.indexOf(t) < TAB_ORDER.indexOf(curTab);
  const changed = curTab !== t;
  S.tab = t; saveSettings();
  $$('.tab').forEach(s => { s.classList.toggle('active', s.id === 'tab-' + t); s.classList.toggle('from-left', !!back); });
  if (changed) {
    movePill(curTab !== null);
    const fab = $('#fab'); fab.classList.add('turn'); setTimeout(() => fab.classList.remove('turn'), 300);
  }
  curTab = t;
  $$('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  updateFab();
  if (t === 'settings' && !$('#tab-settings').children.length) renderSettings();
  if (t === 'updates') { renderUpdates(); S.seenLog = CHANGELOG[0].v; saveSettings(); $('.tabbar').classList.remove('has-new'); }
  if (changed) stagger($('#tab-' + t));
  window.scrollTo({ top: 0 });
}
$$('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
let LOCKED_UI = false;
const TAG_NAMES = { neu: 'Neu', besser: 'Verbessert', fix: 'Bugfix' };

  const seen = S.seenVersion;

    <div class="card rel">
      <div class="rel-head"><b>Version ${esc(r.v)}${i === 0 ? '<span class="rel-new">Aktuell</span>' : ''}</b><span>${esc(fmtShort(r.date))}</span></div>
      ${r.items.map(([t, txt]) => `<div class="chg"><span class="tag ${t}">${TAG_NAMES[t] || t}</span><span>${esc(txt)}</span></div>`).join('')}

}
$('#fab').addEventListener('click', () => {

const MOODS = ['😊','🥰','🤩','😌','😐','😴','😢','😡','🤒'];
let noteQuery = '';
$('#noteSearch').addEventListener('input', e => { noteQuery = e.target.value; renderNotes(); });
$('#notesList').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (c) openNote(c.dataset.id); });

const emptyHtml = (t, p) => `<div class="empty"><div class="orb"></div><h3>${t}</h3><p>${p}</p></div>`;

function renderNotes() {

/* ================= Kalender ================= */
let selDay = todayStr();
let calMonth = new Date(); calMonth.setDate(1);

$('#calPrev').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCal(); });
$('#calNext').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCal(); });
$('#calTitle').addEventListener('click', goToday);
function goToday() { selDay = todayStr(); calMonth = new Date(); calMonth.setDate(1); renderCal(); }
$('#calGrid').addEventListener('click', e => {
  const c = e.target.closest('[data-day]'); if (!c) return;
  selDay = c.dataset.day;
  const d = parseYmd(selDay);
  if (d.getMonth() !== calMonth.getMonth()) { calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
  renderCal();
});
// Wischen zum Monatswechsel
(() => {
  let x0 = null, y0 = null; const g = $('#calGrid');
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  g.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { calMonth.setMonth(calMonth.getMonth() + (dx < 0 ? 1 : -1)); renderCal(); }
    x0 = null;
  }, { passive: true });
})();

const byTime = (a, b) => ((b.allDay ? 1 : 0) - (a.allDay ? 1 : 0)) || String(a.start || '').localeCompare(String(b.start || '')) || String(a.title).localeCompare(String(b.title));

const isPastDay = d => d < todayStr();
function updateFab() {
  const t = S.tab;
  $('#fab').classList.toggle('hidden', t === 'updates' || t === 'settings' || LOCKED_UI || (t === 'cal' && isPastDay(selDay)));
}
function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $('#calTitle').textContent = `${MONTHS[m]} ${y}`;
  const ws = Number(S.weekStart) || 0;
  $('#calDow').innerHTML = [...Array(7)].map((_, i) => `<div class="cal-dow">${DOW_BASE[(i + ws) % 7]}</div>`).join('');
  const offset = (new Date(y, m, 1).getDay() - ws + 7) % 7;
  const daysIn = new Date(y, m + 1, 0).getDate();
  const cells = Math.ceil((offset + daysIn) / 7) * 7;
  const evBy = groupBy(live(D.events), 'date');
  const tdBy = groupBy(live(D.todos).filter(t => t.due && !t.done), 'due');
  const t = todayStr();
  let html = '';
  for (let i = 0; i < cells; i++) {
    const d = new Date(y, m, 1 - offset + i), s = ymd(d);
    const evs = (evBy[s] || []).sort(byTime);
    const dots = evs.slice(0, 3).map(e => `<i class="dot" style="background:${evColor(e.color)}"></i>`).join('') + ((tdBy[s] && evs.length < 3) ? `<i class="dot" style="background:var(--muted)"></i>` : '');
    html += `<button class="cal-day${d.getMonth() !== m ? ' other' : ''}${s === t ? ' today' : ''}${s < t ? ' past' : ''}${s === selDay ? ' sel' : ''}" data-day="${s}">${d.getDate()}${dots ? `<span class="dots">${dots}</span>` : ''}</button>`;
  }
  $('#calGrid').innerHTML = html;
  if (S.tab === 'cal') updateFab();

  const rel = selDay === t ? 'Heute · ' : selDay === addDays(t, 1) ? 'Morgen · ' : selDay === addDays(t, -1) ? 'Gestern · ' : '';
  $('#dayTitle').textContent = rel + fmtLong(selDay);
  const evs = (evBy[selDay] || []).sort(byTime);
  const tds = live(D.todos).filter(x => x.due === selDay);
  let list = evs.map(e => `
    <div class="card tap ev" data-ev="${esc(e.id)}">
      <div class="bar" style="background:${evColor(e.color)}"></div>
      <div class="time">${e.allDay ? '<b>Ganztägig</b>' : (e.start ? `<b>${esc(e.start)}</b>${e.end ? esc(e.end) : ''}` : '<b>–</b>')}</div>
      <div class="info"><b>${esc(e.title)}</b>${e.place ? `<span>📍 ${esc(e.place)}</span>` : ''}${e.note ? `<span>${esc(e.note.slice(0, 140))}</span>` : ''}</div>
    </div>`).join('');
  list += tds.map(todoHtml).join('');
  $('#dayList').innerHTML = list || (isPastDay(selDay)
    ? emptyHtml('Dieser Tag ist vorbei', 'Hier kann nichts mehr eingetragen werden.')
    : emptyHtml('Nichts geplant', 'Tippe auf +, um einen Termin einzutragen.'));
}
$('#dayList').addEventListener('click', e => {
  const ev = e.target.closest('[data-ev]'); if (ev) return openEvent(ev.dataset.ev);
  handleTodoClick(e);
});

function openEvent(id, date) {
  const ex = id ? D.events.find(e => e.id === id) : null;
  const h = (new Date().getHours() + 1) % 24;
  const e = ex ? { ...ex } : { id: uid(), title: '', date: date || todayStr(), allDay: false, start: `${pad(h)}:00`, end: `${pad((h + 1) % 24)}:00`, place: '', note: '', color: 'accent' };
  const sh = openSheet(ex ? 'Termin' : 'Neuer Termin', `

    <div class="two" id="eTimes" style="margin-top:14px">

    <div class="field"><span>Farbe</span><div class="swatches" id="eColors">${Object.keys(EV_COLORS).map(k =>
      `<button type="button" class="swatch sm ${e.color === k ? 'on' : ''}" data-col="${k}" style="background:${evColor(k)}" aria-label="${k}"></button>`).join('')}</div></div>`,
    { onSave: () => {

        if (!title) { toast('Bitte einen Titel eingeben'); return false; }
        const nd = $('#eDate').value || todayStr();
        if (isPastDay(nd) && !(ex && nd === ex.date)) { toast('Vergangene Tage können nicht mehr eingetragen werden'); return false; }
        const obj = { ...e, title, date: $('#eDate').value || todayStr(), allDay: $('#eAll').checked,
          start: $('#eStart').value, end: $('#eEnd').value, place: $('#ePlace').value.trim(), note: $('#eNote').value, color: e.color };
        selDay = obj.date; const d = parseYmd(obj.date); calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
        upsert('events', obj); toast('Termin gespeichert ✓');
      },

  const syncTimes = () => $('#eTimes', sh).classList.toggle('hidden', $('#eAll', sh).checked);

/* ================= To-Dos ================= */
let showDone = false;
function dueInfo(due) {
  if (!due) return null;
  const t = todayStr();
  if (due < t) return { cls: 'late', txt: 'Überfällig · ' + fmtShort(due) };
  if (due === t) return { cls: 'soon', txt: 'Heute' };
  if (due === addDays(t, 1)) return { cls: 'soon', txt: 'Morgen' };
  return { cls: '', txt: fmtShort(due) };
}
function todoHtml(x) {
  const di = !x.done && dueInfo(x.due);
  return `<div class="card todo${x.done ? ' done' : ''}" data-todo="${esc(x.id)}">
    <button class="check" data-check aria-label="Erledigt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></button>
    <div class="todo-main"><div class="todo-text">${esc(x.text)}</div>${di ? `<div class="todo-due ${di.cls}">📅 ${esc(di.txt)}</div>` : ''}${x.note ? `<div class="todo-due">${esc(x.note.slice(0, 100))}</div>` : ''}</div>
  </div>`;
}
function handleTodoClick(e) {
  const card = e.target.closest('[data-todo]'); if (!card) return;
  const id = card.dataset.todo;
  if (e.target.closest('[data-check]')) {
    const t = D.todos.find(x => x.id === id); if (!t) return;
    card.classList.toggle('done'); $('.check', card).classList.add('pop');
    setTimeout(() => upsert('todos', { ...t, done: !t.done, doneAt: !t.done ? now() : 0 }), 220);
  } else openTodo(id);
}
$('#todoOpen').addEventListener('click', handleTodoClick);
$('#todoDone').addEventListener('click', e => {
  if (e.target.closest('#clearDone')) {
    const done = live(D.todos).filter(t => t.done);
    if (done.length && confirm(`${done.length} erledigte Aufgabe(n) löschen?`)) {
      const ids = new Set(done.map(t => t.id));
      D.todos = D.todos.map(x => ids.has(x.id) ? { id: x.id, deleted: true, updatedAt: now() } : x);
      saveData(); render();
    }
    return;
  }
  handleTodoClick(e);
});
$('#doneToggle').addEventListener('click', () => { showDone = !showDone; renderTodos(); });
$('#quickTodo').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#quickTodoInput'), text = inp.value.trim();
  if (!text) return;
  upsert('todos', { id: uid(), text, due: '', note: '', done: false });
  inp.value = '';
});

function renderTodos() {
  const all = live(D.todos);
  const open = all.filter(t => !t.done).sort((a, b) => {
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1; if (b.due) return 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  });
  const done = all.filter(t => t.done).sort((a, b) => (b.doneAt || b.updatedAt) - (a.doneAt || a.updatedAt));
  $('#todoOpen').innerHTML = open.length ? open.map(todoHtml).join('') :
    emptyHtml(done.length ? 'Alles erledigt! ✨' : 'Keine Aufgaben', done.length ? 'Gönn dir eine Pause.' : 'Schreib oben eine Aufgabe rein oder tippe auf +.');
  $('#todoDoneWrap').classList.toggle('hidden', !done.length);
  $('#doneToggle').innerHTML = `<span>Erledigt (${done.length})</span><span>${showDone ? '▾' : '▸'}</span>`;
  $('#todoDone').innerHTML = showDone ? done.map(todoHtml).join('') + `<button class="text-btn" id="clearDone">Erledigte löschen</button>` : '';
}

function openTodo(id) {
  const ex = id ? D.todos.find(t => t.id === id) : null;
  const t = ex ? { ...ex } : { id: uid(), text: '', due: '', note: '', done: false };
  const sh = openSheet(ex ? 'Aufgabe' : 'Neue Aufgabe', `
    <label class="field"><input class="title-in" id="tText" placeholder="Was ist zu tun?" value="${esc(t.text)}" maxlength="300"></label>
    <label class="field"><span>Fällig am (optional)</span><input type="date" id="tDue" value="${esc(t.due)}"></label>
    <button type="button" class="text-btn" id="tNoDue">Kein Datum</button>
    <label class="field"><span>Notiz</span><textarea id="tNote" placeholder="Optional">${esc(t.note || '')}</textarea></label>
    ${ex ? `<div class="box" style="padding:0 4px">${toggleRow('tDone', 'Erledigt', '', t.done)}</div>` : ''}`,
    { onSave: () => {
        const text = $('#tText').value.trim();
        if (!text) { toast('Bitte eine Aufgabe eingeben'); return false; }
        const done = ex ? $('#tDone').checked : false;
        upsert('todos', { ...t, text, due: $('#tDue').value, note: $('#tNote').value, done, doneAt: done ? (t.doneAt || now()) : 0 });
      },
      onDelete: ex ? () => removeItem('todos', t.id) : null });
  $('#tNoDue', sh).addEventListener('click', () => { $('#tDue', sh).value = ''; });

/* ================= Tagesübersicht ================= */
function renderHint() {
  const el = $('#todayHint');
  if (!S.todayHint) { el.classList.add('hidden'); return; }
  const t = todayStr(), hr = new Date().getHours();
  const greet = hr < 5 ? 'Gute Nacht' : hr < 11 ? 'Guten Morgen' : hr < 18 ? 'Hallo' : 'Guten Abend';
  const evs = live(D.events).filter(e => e.date === t).sort(byTime);
  const tds = live(D.todos).filter(x => !x.done && x.due && x.due <= t);
  const parts = [];
  if (evs.length) {
    const nowHM = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
    const next = evs.find(e => !e.allDay && e.start && e.start >= nowHM) || evs[0];
    parts.push(`${evs.length} ${evs.length === 1 ? 'Termin' : 'Termine'} heute – ${next.allDay ? '' : (next.start ? next.start + ' ' : '')}${next.title}`);
  }
  if (tds.length) parts.push(`${tds.length} ${tds.length === 1 ? 'Aufgabe' : 'Aufgaben'} fällig`);
  el.innerHTML = `<div class="orb"></div><div><b>${greet}, Lena ✨</b><span>${esc(parts.join(' · ') || 'Heute steht nichts an. Genieß den Tag!')}</span></div>`;
  el.classList.remove('hidden');

/* ================= Automatische Updates ================= */
let pendingUpdate = null, lastCheck = 0, knownTag = null;
const newer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
async function checkForUpdate() {
  if (pendingUpdate || !navigator.onLine || Date.now() - lastCheck < 8000) return;
  lastCheck = Date.now();
  try {
    // 1) Nur kurz fragen, ob sich die Datei geändert hat (winzige Anfrage)
    const h = await fetch('index.html?check=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    const tag = h.headers.get('ETag') || h.headers.get('Last-Modified') || '';
    if (tag && tag === knownTag) return;
    knownTag = tag;
    // 2) Geändert → neue Version holen und vergleichen
    const r = await fetch('index.html?check=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = '([\d.]+)'/);
    if (m && newer(m[1], APP_VERSION)) { pendingUpdate = m[1]; applyUpdate(); }
  } catch {}
}
function applyUpdate() {
  if (!pendingUpdate) return;
  if (document.body.classList.contains('sheet-open')) return; // nicht stören, während etwas offen ist
  toast('✨ Update wird geladen …');
  setTimeout(() => location.replace(location.pathname + '?v=' + pendingUpdate), 700);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
setInterval(() => { if (document.visibilityState === 'visible') checkForUpdate(); }, 10 * 1000);
setTimeout(checkForUpdate, 1500);
// Adresse nach einem Update wieder aufräumen
if (location.search) history.replaceState(null, '', location.pathname);

/* ================= iOS-Fenster-Korrektur =================
   iOS 26/27 legt Home-Bildschirm-Apps beim Start zu kurz an (Balken unten).
   Ein echter Tab-Wechsel behebt das – also kurz zum Kalender und zurück. */
let vpFixing = false;
const splash = document.getElementById('splash');
function hideSplash() { splash.classList.remove('instant'); splash.classList.add('hide'); }
function fixIOSViewport(minShow) {
  if (vpFixing) return;
  if (LOCKED || document.body.classList.contains('sheet-open')) { hideSplash(); return; }
  vpFixing = true;
  splash.classList.add('instant'); splash.classList.remove('hide');   // Ladebildschirm sofort zeigen
  const back = S.tab, t0 = Date.now();
  setTab(back === 'cal' ? 'notes' : 'cal');
  setTimeout(() => {
    setTab(back);
    setTimeout(() => { vpFixing = false; hideSplash(); }, Math.max(150, (minShow || 0) - (Date.now() - t0)));
  }, 120);
}
window.addEventListener('load', () => setTimeout(() => fixIOSViewport(700), 150));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fixIOSViewport(350); });
setTimeout(() => { if (!vpFixing) hideSplash(); }, 4000); // Sicherheitsnetz

/* ================= Start ================= */
document.querySelectorAll('.ver').forEach(el => { el.textContent = 'Version ' + CHANGELOG[0].v; }); // angezeigte Version = neuester Eintrag
applySettings();
if (!S.seenLog) { S.seenLog = CHANGELOG[0].v; saveSettings(); } // Erststart/Umstellung: nichts als neu markieren
const hasNew = newer(CHANGELOG[0].v, S.seenLog);
setTab(TAB_ORDER.includes(OPEN_TAB) ? OPEN_TAB : TAB_ORDER.includes(S.tab) ? S.tab : 'notes');
if (hasNew && S.tab !== 'updates') {
  $('.tabbar').classList.add('has-new');
  if (!LOCKED) setTimeout(() => toast(`✨ Neue Version ${CHANGELOG[0].v} – schau in „Updates"`), 900);
}
render(); setSyncState();
if (isConfigured() && !LOCKED) sync(false);
if (!LOCKED) setTimeout(checkPushGate, 300);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
}
})();
</script>
